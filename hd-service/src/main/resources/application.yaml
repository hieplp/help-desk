spring:
  application:
    name: hd-service
  datasource:
    url: ${DB_URL:jdbc:sqlite:helpdesk.db}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.community.dialect.SQLiteDialect
  jackson:
    deserialization:
      fail-on-unknown-properties: true

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
    ttl: 8h
